<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blogs | WHA SOL Admin</title>

    <link rel="stylesheet" href="../css/styles.css">

    <style>
        :root {
            --bg: #080a0d;
            --card: #101318;
            --card-hover: #151920;
            --border: rgba(255,255,255,.09);
            --text: #f5f7fa;
            --muted: #8d96a3;
            --accent: #d8ff3e;
            --danger: #ff6262;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* TOP BAR */

        .topbar {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid var(--border);
            background: rgba(8,10,13,.96);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand img {
            width: 130px;
            max-height: 42px;
            object-fit: contain;
        }

        .page-label {
            border-left: 1px solid var(--border);
            padding-left: 16px;
            color: var(--muted);
            font-size: 14px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: 1px solid var(--border);
            background: #151920;
            color: white;
            padding: 11px 17px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn:hover {
            background: #20252d;
        }

        .btn-primary {
            background: var(--accent);
            color: #070900;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: #e6ff73;
        }

        /* MAIN */

        .container {
            max-width: 1450px;
            margin: 0 auto;
            padding: 35px 30px 70px;
        }

        .heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .heading h1 {
            margin: 0 0 8px;
            font-size: 30px;
            letter-spacing: -.5px;
        }

        .heading p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 20px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
        }

        /* TOOLBAR */

        .toolbar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 15px;
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .search {
            flex: 1;
        }

        .search input,
        .filter select {
            width: 100%;
            height: 44px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0c0f13;
            color: white;
            padding: 0 13px;
            outline: none;
        }

        .search input:focus,
        .filter select:focus {
            border-color: rgba(216,255,62,.5);
        }

        .filter {
            width: 190px;
        }

        /* TABLE */

        .table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 13px;
            overflow: hidden;
        }

        .table-header {
            display: grid;
            grid-template-columns: minmax(300px, 2fr) 150px 130px 130px 150px;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .article-row {
            display: grid;
            grid-template-columns: minmax(300px, 2fr) 150px 130px 130px 150px;
            gap: 15px;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }

        .article-row:last-child {
            border-bottom: none;
        }

        .article-row:hover {
            background: var(--card-hover);
        }

        .article-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 20px;
            background: rgba(255,255,255,.06);
            color: #cbd1d8;
            font-size: 11px;
        }

        .brand-name {
            color: #dce2e8;
            font-size: 13px;
        }

        .date {
            color: var(--muted);
            font-size: 12px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-published {
            background: rgba(216,255,62,.1);
            color: var(--accent);
        }

        .status-draft {
            background: rgba(255,255,255,.07);
            color: #aeb6c0;
        }

        .actions {
            display: flex;
            gap: 7px;
            justify-content: flex-end;
        }

        .action-btn {
            width: 35px;
            height: 35px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: #0d1014;
            color: #dce2e8;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #20252d;
        }

        .action-delete:hover {
            border-color: rgba(255,98,98,.4);
            color: var(--danger);
        }

        /* EMPTY */

        .empty {
            padding: 70px 25px;
            text-align: center;
            display: none;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 15px;
            opacity: .6;
        }

        .empty h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .empty p {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 1000px) {

            .table-header {
                display: none;
            }

            .article-row {
                display: block;
                padding: 20px;
            }

            .article-row > div {
                margin-bottom: 10px;
            }

            .actions {
                justify-content: flex-start;
                margin-top: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 700px) {

            .topbar {
                padding: 12px 15px;
            }

            .brand img {
                width: 105px;
            }

            .page-label {
                display: none;
            }

            .container {
                padding: 22px 15px 50px;
            }

            .heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .heading h1 {
                font-size: 25px;
            }

            .toolbar {
                flex-direction: column;
            }

            .filter {
                width: 100%;
            }

        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <a href="./dashboard.html">
            <img src="../WHA-LOGO.PNG.png" alt="WHA SOL">
        </a>

        <span class="page-label">
            Blogs
        </span>

    </div>


    <div class="top-actions">

        <a href="./dashboard.html" class="btn">
            ← Dashboard
        </a>

        <a href="./article-editor.html" class="btn btn-primary">
            + Create Blog
        </a>

    </div>

</header>


<main class="container">

    <div class="heading">

        <div>
            <h1>Blogs</h1>

            <p>
                Manage your WHA SOL blog articles and published guides.
            </p>
        </div>

    </div>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-label">
                Total Articles
            </div>

            <div class="stat-number" id="totalCount">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Published
            </div>

            <div class="stat-number" id="publishedCount">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Drafts
            </div>

            <div class="stat-number" id="draftCount">
                0
            </div>

        </div>

    </section>


    <!-- SEARCH -->

    <section class="toolbar">

        <div class="search">

            <input
                type="search"
                id="searchInput"
                placeholder="Search articles by title, brand, model..."
            >

        </div>


        <div class="filter">

            <select id="statusFilter">

                <option value="all">
                    All Status
                </option>

                <option value="published">
                    Published
                </option>

                <option value="draft">
                    Draft
                </option>

            </select>

        </div>

    </section>


    <!-- TABLE -->

    <section class="table-card">

        <div class="table-header">

            <div>
                Article
            </div>

            <div>
                Brand
            </div>

            <div>
                Category
            </div>

            <div>
                Status
            </div>

            <div>
                Actions
            </div>

        </div>


        <div id="articleList"></div>


        <div class="empty" id="emptyState">

            <div class="empty-icon">
                ◫
            </div>

            <h3>
                No articles found
            </h3>

            <p>
                You have not created any articles yet, or your search returned no results.
            </p>

            <a
                href="./article-editor.html"
                class="btn btn-primary"
            >
                Create Your First Article
            </a>

        </div>

    </section>

</main>


<script src="../js/data.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>


<script>

    const STORAGE_KEY = "whasol_admin_articles";

    let articles = [];


    /* =========================================================
       LOAD ARTICLES
       ========================================================= */

    function loadArticles() {

        let localArticles = [];

        try {

            localArticles =
                JSON.parse(
                    localStorage.getItem(STORAGE_KEY)
                ) || [];

        } catch (error) {

            localArticles = [];

        }


        /*
         * Existing WHA SOL blog articles from data.js
         * are also displayed.
         */

        let existingArticles = [];

        if (
            window.WHASOL &&
            Array.isArray(window.WHASOL.blogPosts)
        ) {

            existingArticles =
                window.WHASOL.blogPosts.map(
                    article => ({
                        id:
                            article.id ||
                            "existing-" + Math.random(),

                        title:
                            article.title ||
                            "Untitled Article",

                        brand:
                            article.brand ||
                            "",

                        model:
                            article.model ||
                            "",

                        category:
                            article.category ||
                            "General",

                        status:
                            "published",

                        createdAt:
                            article.date ||
                            article.createdAt ||
                            new Date().toISOString(),

                        existing:
                            true
                    })
                );

        }


        /*
         * Show newly-created admin articles first.
         */

        articles = [
            ...localArticles,
            ...existingArticles
        ];

        updateStats();

        renderArticles();

    }


    /* =========================================================
       STATS
       ========================================================= */

    function updateStats() {

        const published =
            articles.filter(
                article =>
                    article.status === "published"
            ).length;

        const drafts =
            articles.filter(
                article =>
                    article.status === "draft"
            ).length;


        document.getElementById("totalCount")
            .textContent = articles.length;

        document.getElementById("publishedCount")
            .textContent = published;

        document.getElementById("draftCount")
            .textContent = drafts;

    }


    /* =========================================================
       RENDER
       ========================================================= */

    function renderArticles() {

        const search =
            document.getElementById(
                "searchInput"
            ).value
            .trim()
            .toLowerCase();


        const status =
            document.getElementById(
                "statusFilter"
            ).value;


        const filtered =
            articles.filter(article => {

                const searchable = [

                    article.title,
                    article.brand,
                    article.model,
                    article.category

                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    searchable.includes(search);


                const matchesStatus =
                    status === "all" ||
                    article.status === status;


                return matchesSearch &&
                       matchesStatus;

            });


        const list =
            document.getElementById(
                "articleList"
            );

        const empty =
            document.getElementById(
                "emptyState"
            );


        list.innerHTML = "";


        if (!filtered.length) {

            empty.style.display = "block";

            return;

        }


        empty.style.display = "none";


        filtered.forEach(article => {

            const row =
                document.createElement("div");

            row.className = "article-row";


            const articleColumn =
                document.createElement("div");

            const title =
                document.createElement("div");

            title.className =
                "article-title";

            title.textContent =
                article.title ||
                "Untitled Article";


            const meta =
                document.createElement("div");

            meta.className =
                "article-meta";


            if (article.model) {

                const modelTag =
                    document.createElement("span");

                modelTag.className = "tag";

                modelTag.textContent =
                    article.model;

                meta.appendChild(modelTag);

            }


            articleColumn.appendChild(title);

            articleColumn.appendChild(meta);


            /* BRAND */

            const brandColumn =
                document.createElement("div");

            brandColumn.className =
                "brand-name";

            brandColumn.textContent =
                article.brand ||
                "—";


            /* CATEGORY */

            const categoryColumn =
                document.createElement("div");

            const categoryTag =
                document.createElement("span");

            categoryTag.className =
                "tag";

            categoryTag.textContent =
                article.category ||
                "General";

            categoryColumn.appendChild(
                categoryTag
            );


            /* STATUS */

            const statusColumn =
                document.createElement("div");

            const status =
                document.createElement("span");

            status.className =
                "status " +
                (
                    article.status === "published"
                        ? "status-published"
                        : "status-draft"
                );

            status.textContent =
                article.status === "published"
                    ? "Published"
                    : "Draft";

            statusColumn.appendChild(status);


            /* ACTIONS */

            const actionsColumn =
                document.createElement("div");

            actionsColumn.className =
                "actions";


            /*
             * View
             */

            const viewButton =
                document.createElement("button");

            viewButton.className =
                "action-btn";

            viewButton.title =
                "View";

            viewButton.innerHTML =
                "↗";

            viewButton.onclick =
                function () {

                    if (article.slug) {

                        window.open(
                            "../" +
                            article.slug,
                            "_blank"
                        );

                    } else {

                        alert(
                            "This article does not have a public URL yet."
                        );

                    }

                };


            /*
             * Delete
             */

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "action-btn action-delete";

            deleteButton.title =
                "Delete";

            deleteButton.innerHTML =
                "×";


            deleteButton.onclick =
                function () {

                    deleteArticle(
                        article.id,
                        article.existing
                    );

                };


            actionsColumn.appendChild(
                viewButton
            );

            actionsColumn.appendChild(
                deleteButton
            );


            row.appendChild(
                articleColumn
            );

            row.appendChild(
                brandColumn
            );

            row.appendChild(
                categoryColumn
            );

            row.appendChild(
                statusColumn
            );

            row.appendChild(
                actionsColumn
            );


            list.appendChild(row);

        });

    }


    /* =========================================================
       DELETE
       ========================================================= */

    function deleteArticle(
        id,
        isExisting
    ) {

        if (isExisting) {

            alert(
                "This article comes from your existing WHA SOL data.js content. Manage it from the original article data for now."
            );

            return;

        }


        const confirmed =
            confirm(
                "Are you sure you want to delete this article?"
            );


        if (!confirmed) return;


        let stored = [];

        try {

            stored =
                JSON.parse(
                    localStorage.getItem(STORAGE_KEY)
                ) || [];

        } catch (error) {

            stored = [];

        }


        stored =
            stored.filter(
                article =>
                    article.id !== id
            );


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(stored)
        );


        loadArticles();

    }


    /* =========================================================
       SEARCH
       ========================================================= */

    document.getElementById("searchInput")
        .addEventListener(
            "input",
            renderArticles
        );


    document.getElementById("statusFilter")
        .addEventListener(
            "change",
            renderArticles
        );


    /* =========================================================
       AUTH
       ========================================================= */

    async function checkAdminAccess() {

        try {

            if (
                window.WHASOL &&
                window.WHASOL.auth &&
                typeof window.WHASOL.auth.requireAuth === "function"
            ) {

                await window.WHASOL.auth.requireAuth("./login.html");

            }

        } catch (error) {

            console.error(
                "Authentication check failed:",
                error
            );

            window.location.href =
                "./login.html";

            return;

        }


        loadArticles();

    }


    /* =========================================================
       START
       ========================================================= */

    checkAdminAccess();

</script>

</body>
</html>
