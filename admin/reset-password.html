<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>WHA SOL Admin — Reset Password</title>

  <!-- WHA SOL CSS -->
  <link rel="stylesheet" href="../css/styles.css">

  <!-- WHA SOL Configuration -->
  <script src="../js/data.js"></script>
  <script src="../js/supabase.js"></script>

  <style>
    :root {
      --admin-bg: #080b10;
      --admin-surface: #0e131a;
      --admin-surface-2: #121821;
      --admin-border: rgba(255, 255, 255, 0.09);
      --admin-border-focus: rgba(255, 255, 255, 0.22);
      --admin-text: #f5f7fa;
      --admin-muted: #8e98a7;
      --admin-success: #6ee7a0;
      --admin-danger: #ff7777;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255, 255, 255, 0.045),
          transparent 32%
        ),
        var(--admin-bg);

      color: var(--admin-text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      overflow-x: hidden;
    }

    /* Background */

    .admin-background {
      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0.3;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );

      background-size: 56px 56px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 85%
        );
    }

    /* Main */

    .admin-shell {
      position: relative;

      width: 100%;

      max-width: 460px;

      z-index: 1;
    }

    /* Brand */

    .admin-brand {
      text-align: center;

      margin-bottom: 28px;
    }

    .admin-logo {
      width: 88px;
      height: 88px;

      object-fit: contain;

      display: block;

      margin: 0 auto 18px;

      border-radius: 18px;
    }

    .admin-brand-name {
      margin: 0;

      font-size: 25px;

      line-height: 1.15;

      font-weight: 700;

      letter-spacing: -0.6px;
    }

    .admin-brand-subtitle {
      margin: 8px 0 0;

      color: var(--admin-muted);

      font-size: 13px;

      letter-spacing: 0.2px;
    }

    /* Card */

    .reset-card {
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.045),
          rgba(255, 255, 255, 0.018)
        ),
        var(--admin-surface);

      border: 1px solid var(--admin-border);

      border-radius: 24px;

      padding: 34px;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);

      backdrop-filter: blur(18px);

      -webkit-backdrop-filter: blur(18px);
    }

    /* Badge */

    .security-badge {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 24px;

      padding: 7px 10px;

      border: 1px solid var(--admin-border);

      border-radius: 999px;

      color: var(--admin-muted);

      font-size: 11px;

      letter-spacing: 0.2px;
    }

    .security-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--admin-success);

      box-shadow:
        0 0 10px rgba(110, 231, 160, 0.4);
    }

    /* Heading */

    .reset-heading {
      margin-bottom: 28px;
    }

    .reset-heading h1 {
      margin: 0;

      font-size: 22px;

      font-weight: 650;

      letter-spacing: -0.35px;
    }

    .reset-heading p {
      margin: 8px 0 0;

      color: var(--admin-muted);

      font-size: 14px;

      line-height: 1.5;
    }

    /* Form */

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      color: #dce1e8;

      font-size: 13px;

      font-weight: 550;
    }

    .form-input {
      width: 100%;

      height: 50px;

      padding: 0 15px;

      background: var(--admin-surface-2);

      border: 1px solid var(--admin-border);

      border-radius: 12px;

      color: var(--admin-text);

      font-size: 14px;

      outline: none;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .form-input::placeholder {
      color: #596473;
    }

    .form-input:hover {
      border-color: rgba(255, 255, 255, 0.14);
    }

    .form-input:focus {
      border-color: var(--admin-border-focus);

      background: #151b24;

      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.035);
    }

    /* Password */

    .password-wrapper {
      position: relative;
    }

    .password-wrapper .form-input {
      padding-right: 74px;
    }

    .password-toggle {
      position: absolute;

      right: 10px;

      top: 50%;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: #7f8997;

      font-size: 12px;

      font-weight: 600;

      padding: 7px 8px;

      cursor: pointer;
    }

    .password-toggle:hover {
      color: #ffffff;
    }

    /* Message */

    .reset-message {
      display: none;

      margin-bottom: 18px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.45;
    }

    .reset-message.visible {
      display: block;
    }

    .reset-message.error {
      border: 1px solid rgba(255, 107, 107, 0.2);

      background: rgba(255, 107, 107, 0.06);

      color: #ff9b9b;
    }

    .reset-message.success {
      border: 1px solid rgba(110, 231, 160, 0.2);

      background: rgba(110, 231, 160, 0.06);

      color: #9af0bc;
    }

    /* Button */

    .update-button {
      width: 100%;

      height: 50px;

      border: 0;

      border-radius: 12px;

      background: #f5f7fa;

      color: #080b10;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        box-shadow 0.2s ease;
    }

    .update-button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.25);
    }

    .update-button:active {
      transform: translateY(0);
    }

    .update-button:disabled {
      cursor: not-allowed;

      opacity: 0.55;

      transform: none;

      box-shadow: none;
    }

    .button-loading {
      display: none;
    }

    .update-button.loading .button-text {
      display: none;
    }

    .update-button.loading .button-loading {
      display: inline;
    }

    /* Login link */

    .back-login {
      display: block;

      margin-top: 20px;

      text-align: center;

      color: #8e98a7;

      font-size: 13px;

      text-decoration: none;
    }

    .back-login:hover {
      color: #ffffff;
    }

    /* Footer */

    .admin-footer {
      margin-top: 22px;

      text-align: center;

      color: #56606e;

      font-size: 11px;

      line-height: 1.5;
    }

    /* Mobile */

    @media (max-width: 520px) {

      body {
        padding: 16px;
      }

      .reset-card {
        padding: 25px 20px;

        border-radius: 20px;
      }

      .admin-logo {
        width: 76px;
        height: 76px;
      }

      .admin-brand-name {
        font-size: 22px;
      }

      .reset-heading h1 {
        font-size: 20px;
      }

      .form-input,
      .update-button {
        font-size: 16px;
      }
    }

    @media (max-width: 360px) {

      body {
        padding: 12px;
      }

      .reset-card {
        padding: 22px 16px;
      }

      .form-input,
      .update-button {
        height: 48px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="admin-background"></div>


  <main class="admin-shell">

    <!-- BRAND -->

    <header class="admin-brand">

      <img
        src="../WHA-LOGO.PNG.png"
        alt="WHA SOL"
        class="admin-logo"
      >

      <h2 class="admin-brand-name">
        WHA SOL Admin
      </h2>

      <p class="admin-brand-subtitle">
        Secure content management
      </p>

    </header>


    <!-- RESET CARD -->

    <section class="reset-card">

      <div class="security-badge">

        <span class="security-dot"></span>

        Secure password recovery

      </div>


      <div class="reset-heading">

        <h1>
          Create a new password
        </h1>

        <p>
          Choose a new password for your WHA SOL admin account.
        </p>

      </div>


      <!-- MESSAGE -->

      <div
        id="resetMessage"
        class="reset-message"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- FORM -->

      <form
        id="resetForm"
        novalidate
      >

        <!-- NEW PASSWORD -->

        <div class="form-group">

          <label
            class="form-label"
            for="newPassword"
          >
            New password
          </label>

          <div class="password-wrapper">

            <input
              id="newPassword"
              name="newPassword"
              class="form-input"
              type="password"
              autocomplete="new-password"
              placeholder="Enter your new password"
              minlength="8"
              required
            >

            <button
              type="button"
              id="newPasswordToggle"
              class="password-toggle"
              aria-label="Show password"
            >
              Show
            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label
            class="form-label"
            for="confirmPassword"
          >
            Confirm new password
          </label>

          <div class="password-wrapper">

            <input
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              type="password"
              autocomplete="new-password"
              placeholder="Confirm your new password"
              minlength="8"
              required
            >

            <button
              type="button"
              id="confirmPasswordToggle"
              class="password-toggle"
              aria-label="Show password"
            >
              Show
            </button>

          </div>

        </div>


        <!-- UPDATE BUTTON -->

        <button
          type="submit"
          id="updateButton"
          class="update-button"
        >

          <span class="button-text">
            Update Password
          </span>

          <span class="button-loading">
            Updating...
          </span>

        </button>

      </form>


      <!-- BACK TO LOGIN -->

      <a
        href="./login.html"
        class="back-login"
      >
        ← Back to Admin Login
      </a>

    </section>


    <!-- FOOTER -->

    <footer class="admin-footer">

      WHA SOL · Authorized access only

    </footer>

  </main>


  <!-- PASSWORD RESET JAVASCRIPT -->

  <script>

    (function () {

      "use strict";


      const form =
        document.getElementById("resetForm");

      const newPasswordInput =
        document.getElementById("newPassword");

      const confirmPasswordInput =
        document.getElementById("confirmPassword");

      const updateButton =
        document.getElementById("updateButton");

      const resetMessage =
        document.getElementById("resetMessage");

      const newPasswordToggle =
        document.getElementById("newPasswordToggle");

      const confirmPasswordToggle =
        document.getElementById("confirmPasswordToggle");


      /* SHOW MESSAGE */

      function showMessage(message, type) {

        resetMessage.textContent = message;

        resetMessage.className =
          "reset-message visible " + type;

      }


      /* HIDE MESSAGE */

      function hideMessage() {

        resetMessage.textContent = "";

        resetMessage.className =
          "reset-message";

      }


      /* LOADING */

      function setLoading(isLoading) {

        updateButton.disabled =
          isLoading;

        if (isLoading) {

          updateButton.classList.add(
            "loading"
          );

        } else {

          updateButton.classList.remove(
            "loading"
          );

        }

      }


      /* PASSWORD TOGGLE */

      function setupPasswordToggle(
        button,
        input
      ) {

        button.addEventListener(
          "click",
          function () {

            const isPassword =
              input.type === "password";


            input.type =
              isPassword
                ? "text"
                : "password";


            button.textContent =
              isPassword
                ? "Hide"
                : "Show";


            button.setAttribute(
              "aria-label",
              isPassword
                ? "Hide password"
                : "Show password"
            );

          }
        );

      }


      setupPasswordToggle(
        newPasswordToggle,
        newPasswordInput
      );


      setupPasswordToggle(
        confirmPasswordToggle,
        confirmPasswordInput
      );


      /* UPDATE PASSWORD */

      form.addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();


          hideMessage();


          const newPassword =
            newPasswordInput.value;

          const confirmPassword =
            confirmPasswordInput.value;


          /* PASSWORD LENGTH */

          if (newPassword.length < 8) {

            showMessage(
              "Your password must contain at least 8 characters.",
              "error"
            );

            newPasswordInput.focus();

            return;

          }


          /* PASSWORD MATCH */

          if (
            newPassword !==
            confirmPassword
          ) {

            showMessage(
              "The passwords do not match.",
              "error"
            );

            confirmPasswordInput.focus();

            return;

          }


          /* SUPABASE CHECK */

          if (
            !window.WHASOL ||
            !window.WHASOL.supabase
          ) {

            showMessage(
              "Authentication system is not ready. Please refresh the page and try again.",
              "error"
            );

            return;

          }


          setLoading(true);


          try {

            /*
             * Supabase uses the recovery
             * session from the email link.
             *
             * The password is changed using
             * the authenticated recovery session.
             */

            const {
              error
            } =
              await window.WHASOL.supabase.auth
                .updateUser({
                  password: newPassword
                });


            if (error) {

              console.error(
                "WHA SOL password update error:",
                error
              );


              showMessage(
                error.message ||
                "Unable to update your password. Please request a new recovery email.",
                "error"
              );


              setLoading(false);

              return;

            }


            showMessage(
              "Password updated successfully. Redirecting to admin login...",
              "success"
            );


            /*
             * Sign out the recovery session
             * before returning to login.
             */

            try {

              await window.WHASOL.supabase.auth
                .signOut();

            } catch (signOutError) {

              console.warn(
                "WHA SOL: Sign out after password reset failed.",
                signOutError
              );

            }


            setTimeout(
              function () {

                window.location.href =
                  "./login.html";

              },
              1800
            );


          } catch (error) {

            console.error(
              "WHA SOL password reset error:",
              error
            );


            showMessage(
              "Something went wrong while updating your password. Please request a new recovery email.",
              "error"
            );


            setLoading(false);

          }

        }
      );


    })();

  </script>

</body>
</html>
